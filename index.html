<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AI Voice App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b1020;color:#f8fafc}
.app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 16px;background:#111827;position:sticky;top:0;z-index:5;border-bottom:1px solid #263244}
h1{font-size:21px;margin:0 0 5px}.sub{color:#94a3b8;font-size:12px}
#chat{flex:1;padding:16px;overflow:auto}.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-start}.msg.ai{justify-content:flex-end}
.bubble{max-width:86%;padding:12px 14px;border-radius:18px;line-height:1.8;white-space:pre-wrap}
.user .bubble{background:#2563eb}.ai .bubble{background:#1e293b}
.bottom{padding:12px;background:#111827;border-top:1px solid #263244;position:sticky;bottom:0}
.row{display:flex;gap:8px}.row input{flex:1}.row button{width:52px}
input,button{border:0;border-radius:14px;padding:13px;font:inherit}input{background:#1f2937;color:#fff;outline:none}
button{background:#2563eb;color:#fff;cursor:pointer}.mic{background:#16a34a}.send{background:#7c3aed}
.quick{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.quick button{white-space:nowrap;background:#1f2937;font-size:12px;padding:9px 11px}
.status{font-size:11px;color:#94a3b8;margin-top:7px;text-align:center}
.typing{opacity:.7}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🤖 دستیار صوتی هوش مصنوعی</h1>
<div class="sub">🎤 صحبت کن، سؤال بپرس و پاسخ را با صدا بشنو</div>
</header>
<main id="chat"></main>
<div class="bottom">
<div class="quick">
<button onclick="quick('سلام، خودت را معرفی کن')">👋 معرفی</button>
<button onclick="quick('امروز چه کارهایی می‌توانی انجام بدهی؟')">💡 امکانات</button>
<button onclick="quick('یک لطیفه کوتاه بگو')">😂 لطیفه</button>
</div>
<div class="row">
<input id="text" placeholder="پیامت را بنویس..." autocomplete="off">
<button class="mic" id="mic" onclick="startVoice()">🎤</button>
<button class="send" onclick="send()">➤</button>
</div>
<div class="status" id="status">حالت آزمایشی فعال است — برای اتصال واقعی، Worker را تنظیم کن.</div>
</div>
</div>

<script>
const WORKER_URL = "https://ai-voice-worker.aghilechresh83.workers.dev/";
const chat=document.getElementById("chat"), input=document.getElementById("text"), status=document.getElementById("status");
let history=[];

function add(role,text){
  const wrap=document.createElement("div"); wrap.className="msg "+(role==="user"?"user":"ai");
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  wrap.appendChild(b); chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="fa-IR"; u.rate=.95; u.pitch=1;
  speechSynthesis.speak(u);
}
function quick(t){input.value=t;send()}
function demo(text){
  const t=text.toLowerCase();
  if(t.includes("سلام")) return "سلام! 👋 من دستیار صوتی هوش مصنوعی هستم. آماده‌ام باهات صحبت کنم.";
  if(t.includes("معرفی")) return "من یک دستیار صوتی فارسی هستم. می‌توانی با میکروفون صحبت کنی و پاسخ من را با صدا بشنوی.";
  if(t.includes("لطیفه")) return "یه روز کامپیوتر رفت دکتر! دکتر گفت: مشکلت چیه؟ گفت: ویروسی شدم! 😄";
  if(t.includes("امکانات")) return "فعلاً می‌توانم پیام متنی بگیرم، صدای فارسی را تشخیص بدهم و پاسخ را با صدای فارسی پخش کنم. با Worker می‌توانیم هوش مصنوعی واقعی را هم وصل کنیم.";
  return "پیامت را دریافت کردم 😊 برای پاسخ هوش مصنوعی واقعی، آدرس Cloudflare Worker را داخل index.html جایگزین کن.";
}
async function askAI(text){
  const r=await fetch(WORKER_URL,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,history})
  });
  if(!r.ok) throw new Error("Worker error "+r.status);
  const data=await r.json();
  if(!data.answer) throw new Error("پاسخ نامعتبر");
  return data.answer;
}
async function send(){
  const text=input.value.trim(); if(!text)return;
  input.value=""; add("user",text); history.push({role:"user",content:text});
  status.textContent="در حال پاسخ‌گویی…";
  let answer;
  try{
    if(!WORKER_URL.includes("YOUR-WORKER")) answer=await askAI(text);
    else answer=demo(text);
  }catch(e){
    answer="⚠️ اتصال به هوش مصنوعی برقرار نشد. آدرس Worker را بررسی کن.";
  }
  add("ai",answer); history.push({role:"assistant",content:answer}); speak(answer);
  status.textContent=WORKER_URL.includes("YOUR-WORKER")?"حالت آزمایشی فعال است":"اتصال به Worker فعال است";
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){status.textContent="مرورگر شما تشخیص گفتار را پشتیبانی نمی‌کند؛ Chrome را امتحان کن.";return}
  const r=new SR(); r.lang="fa-IR"; r.interimResults=false; r.continuous=false;
  status.textContent="🎤 گوش می‌دهم…";
  r.onresult=e=>{input.value=e.results[0][0].transcript;send()};
  r.onerror=()=>status.textContent="مشکل در دریافت صدا. اجازه میکروفون را بررسی کن.";
  r.onend=()=>{if(!input.value)status.textContent="آماده‌ام 🎤"};
  r.start();
}
add("ai","سلام! 👋\nمن آماده‌ام. روی 🎤 بزن و فارسی صحبت کن.");
</script>
</body>
</html>
